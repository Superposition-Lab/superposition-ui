name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — the newest push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` not `install`: fail on a lockfile that disagrees with package.json
      # rather than silently resolving something new.
      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # A build that emits no pages is a green check that means nothing.
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/rss.xml
          test -f dist/sitemap-index.xml
          test -f dist/og/index.png
          echo "Pages built: $(find dist -name '*.html' | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

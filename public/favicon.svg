<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark: two process-ink dots overlapping.

    The site renders this with mix-blend-mode, but blend modes are unreliable in
    favicon rendering contexts, so the overlap is drawn explicitly: a lens
    clipped to both circles, filled with the multiply product of the two inks
    (#0088b0 x #d6006c = #00004a).
  -->
  <defs>
    <clipPath id="cyan-dot">
      <circle cx="12.5" cy="16" r="9" />
    </clipPath>
  </defs>

  <rect width="32" height="32" fill="#f3f2f2" />
  <circle cx="12.5" cy="16" r="9" fill="#0088b0" />
  <circle cx="19.5" cy="16" r="9" fill="#d6006c" />
  <g clip-path="url(#cyan-dot)">
    <circle cx="19.5" cy="16" r="9" fill="#00004a" />
  </g>
</svg>
